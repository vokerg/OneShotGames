name: UFR-142 architecture correction

on:
  push:
    branches: ['ufrts/UFR-142-responsive-viewport-runtime']

permissions:
  contents: write

jobs:
  materialize-index:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ufrts/UFR-142-responsive-viewport-runtime
      - name: Split viewport bootstrap ownership
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('ukrainian-front-rts/index.html')
          text = path.read_text()
          old = '    <script type="module" src="src/ui/viewport-runtime-bootstrap.js"></script>'
          new = '    <script type="module" src="src/render/viewport-runtime-bootstrap.js"></script>\n' + old
          if text.count(old) != 1:
              raise SystemExit('expected exactly one viewport bootstrap script')
          path.write_text(text.replace(old, new))
          PY
          rm .github/workflows/ufr142-architecture-fix.yml
      - name: Commit corrected composition
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ukrainian-front-rts/index.html .github/workflows/ufr142-architecture-fix.yml
          git commit -m '[UFR-142] Split viewport bootstrap ownership'
          git push origin HEAD:ufrts/UFR-142-responsive-viewport-runtime
