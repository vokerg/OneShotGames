name: Issue 215 mission gate materializer

on:
  pull_request:
    branches: [main]
    paths:
      - 'ukrainian-front-rts/scripts/dev/issue-215-mission-gate-materialize.mjs'
      - '.github/workflows/issue-215-mission-gate-materialize.yml'

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'ufrts/issue-215-infantry-fidelity'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply mission gate patch
        working-directory: ukrainian-front-rts
        run: node scripts/dev/issue-215-mission-gate-materialize.mjs
      - name: Syntax check review gate
        working-directory: ukrainian-front-rts
        run: node --check scripts/ukrainian-infantry-mission-readability-smoke.mjs
      - name: Commit materialized gate
        run: |
          if git diff --quiet; then
            echo 'No materialized changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ukrainian-front-rts/scripts/ukrainian-infantry-mission-readability-smoke.mjs
          git commit -m 'test(art): require live infantry in mission captures'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
