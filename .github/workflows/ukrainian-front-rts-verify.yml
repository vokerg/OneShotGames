name: Ukrainian Front RTS verification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ukrainian-front-rts/**'
      - '.github/workflows/ukrainian-front-rts-verify.yml'
  pull_request:
    paths:
      - 'ukrainian-front-rts/**'
      - '.github/workflows/ukrainian-front-rts-verify.yml'

permissions:
  contents: write
  pull-requests: read

jobs:
  materialize-ufr110:
    if: github.event_name == 'pull_request' && github.head_ref == 'ufrts/UFR-110-ua-infantry-atlas'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore reviewed implementation payload
        shell: bash
        run: |
          cat .github/ufr110-payload/part-* > /tmp/ufr110-transfer.b64
          base64 --decode /tmp/ufr110-transfer.b64 > /tmp/ufr110-transfer.tgz
          echo "fb2a6c80f0fe2eb83fec09821796222f673ca35ba754e73afeab57eca9b39c3e  /tmp/ufr110-transfer.tgz" | sha256sum --check --strict
          tar -xzf /tmp/ufr110-transfer.tgz -C .
      - name: Generate and verify canonical outputs
        shell: bash
        run: |
          cd ukrainian-front-rts
          node scripts/build-ukrainian-infantry-atlas.mjs
          node scripts/verify-ukrainian-infantry-art.mjs
          node --test tests/art/ukrainian-infantry-atlas.test.mjs
      - name: Replace transfer files with implementation
        shell: bash
        run: |
          rm -rf .github/ufr110-payload .github/workflows/ufr110-materialize.yml
          git fetch origin main
          git checkout origin/main -- .github/workflows/ukrainian-front-rts-verify.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement UFR-110 Ukrainian infantry atlas"
          git push origin "HEAD:${GITHUB_HEAD_REF}"

  verify:
    if: github.event_name != 'pull_request' || github.head_ref != 'ufrts/UFR-110-ua-infantry-atlas'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ukrainian-front-rts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare diagnostics directory
        run: mkdir -p artifacts
      - name: Full assembled verifier
        shell: bash
        run: |
          set +e
          ./verify.sh > artifacts/assembled-verifier.log 2>&1
          status=$?
          cat artifacts/assembled-verifier.log
          if [ "$status" -ne 0 ]; then
            tail -n 80 artifacts/assembled-verifier.log | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g' | while IFS= read -r line; do
              echo "::error title=Full assembled verifier::${line}"
            done
          fi
          exit "$status"
      - name: Active claim diagnostics
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/verify-active-claims.mjs
      - name: Browser startup and mission smoke
        if: always()
        run: node scripts/browser-startup-smoke.mjs
      - name: Visual regression review capture
        if: always()
        run: node scripts/visual-regression-smoke.mjs
      - name: Browser audio autoplay and resume smoke
        if: always()
        run: node scripts/browser-audio-release-smoke.mjs
      - name: Browser accessibility settings and focus pause smoke
        if: always()
        run: node scripts/browser-accessibility-settings-smoke.mjs
      - name: Browser localization smoke
        if: always()
        run: node scripts/browser-localization-smoke.mjs
      - name: Generate completion evidence audit
        if: always()
        run: node scripts/generate-completion-audit.mjs --output artifacts/completion-evidence-audit.md
      - name: Upload verification diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ukrainian-front-rts-verification-${{ github.run_id }}
          path: ukrainian-front-rts/artifacts/
          if-no-files-found: error
          retention-days: 14
