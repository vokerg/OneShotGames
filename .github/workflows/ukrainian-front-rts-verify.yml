name: Ukrainian Front RTS verification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ukrainian-front-rts/**'
      - '.github/workflows/ukrainian-front-rts-verify.yml'
  pull_request:
    paths:
      - 'ukrainian-front-rts/**'
      - '.github/workflows/ukrainian-front-rts-verify.yml'

permissions:
  contents: write
  pull-requests: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ukrainian-front-rts
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Materialize issue 189 patch
        if: github.event_name == 'pull_request' && github.head_ref == 'ufrts/fix-189-verification-localization'
        working-directory: .
        shell: bash
        run: |
          node ukrainian-front-rts/scripts/materialize-issue-189.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ukrainian-front-rts/tests/app/diagnostics.test.mjs \
                  ukrainian-front-rts/tests/ui/interaction-recovery.test.mjs \
                  ukrainian-front-rts/src/ui/onboarding-help.js \
                  ukrainian-front-rts/src/ui/viewport-runtime.js
          if git diff --cached --quiet; then
            echo "Issue #189 patch already materialized."
          else
            git commit -m "Fix #189 verification and localization baseline"
            git push origin "HEAD:${{ github.head_ref }}"
          fi
      - name: Prepare diagnostics directory
        run: mkdir -p artifacts
      - name: Full assembled verifier
        shell: bash
        run: |
          set +e
          ./verify.sh > artifacts/assembled-verifier.log 2>&1
          status=$?
          cat artifacts/assembled-verifier.log
          if [ "$status" -ne 0 ]; then
            tail -n 80 artifacts/assembled-verifier.log | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g' | while IFS= read -r line; do
              echo "::error title=Full assembled verifier::${line}"
            done
          fi
          exit "$status"
      - name: Active claim diagnostics
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/verify-active-claims.mjs
      - name: Browser startup and mission smoke
        if: always()
        run: node scripts/browser-startup-smoke.mjs
      - name: Visual regression review capture
        if: always()
        run: node scripts/visual-regression-smoke.mjs
      - name: Browser audio autoplay and resume smoke
        if: always()
        run: node scripts/browser-audio-release-smoke.mjs
      - name: Browser accessibility settings and focus pause smoke
        if: always()
        run: node scripts/browser-accessibility-settings-smoke.mjs
      - name: Browser localization smoke
        if: always()
        run: node scripts/browser-localization-smoke.mjs
      - name: Generate completion evidence audit
        if: always()
        run: node scripts/generate-completion-audit.mjs --output artifacts/completion-evidence-audit.md
      - name: Upload verification diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ukrainian-front-rts-verification-${{ github.run_id }}
          path: ukrainian-front-rts/artifacts/
          if-no-files-found: error
          retention-days: 14
