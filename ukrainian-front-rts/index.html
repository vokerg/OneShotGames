<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ukrainian Front RTS</title>
  <style>
    :root{color-scheme:dark;--ink:#e8e0c8;--panel:#171c1d;--edge:#6e6245;--gold:#d4ad4a;--blue:#2b67a0;--red:#9b3d35}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d1112;color:var(--ink);font-family:Georgia,serif}
    #game{display:block;width:100vw;height:100vh;image-rendering:pixelated;cursor:crosshair}
    #hud{position:fixed;inset:0;pointer-events:none}.top{position:absolute;left:12px;right:12px;top:10px;display:flex;gap:10px;align-items:flex-start}.plate{background:linear-gradient(#2b2f2d,#171a19);border:3px ridge #8a7950;box-shadow:0 3px 10px #000;padding:7px 10px;text-shadow:1px 1px #000}.resources{display:flex;gap:16px;font-weight:bold}.objective{margin-left:auto;max-width:430px;font-size:14px}.bottom{position:absolute;left:12px;right:12px;bottom:10px;display:flex;justify-content:space-between;align-items:flex-end}.panel{width:min(520px,58vw);min-height:92px}.title{color:#f2d67d;font-weight:bold;letter-spacing:.06em}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}.action{pointer-events:auto;background:#343c38;color:#f0e7ca;border:2px outset #8b7951;padding:7px 9px;font:700 13px Georgia;cursor:pointer}.action:hover{filter:brightness(1.2)}.action:disabled{opacity:.45;cursor:not-allowed}.hint{font-size:12px;color:#c8bea1;margin-top:6px}.miniwrap{width:210px;height:142px;padding:5px}.miniwrap canvas{width:100%;height:100%;display:block;background:#111;border:1px solid #8a7950;image-rendering:pixelated}.message{position:absolute;left:50%;top:16%;transform:translateX(-50%);font-size:24px;color:#ffe69a;opacity:0;transition:opacity .2s}.message.show{opacity:1}.badge{display:inline-block;border:1px solid #8a7950;padding:2px 6px;margin-left:7px;font-size:11px;color:#f3d777}
    @media(max-width:700px){.objective{display:none}.panel{width:65vw}.miniwrap{width:150px;height:105px}.top{font-size:12px}.bottom{bottom:4px;left:4px;right:4px}}
  </style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div class="top">
    <div class="plate resources"><span>SUPPLY <b id="supply">0</b></span><span>COMMAND <b id="command">0/30</b></span><span>SECTORS <b id="sectors">0/3</b></span></div>
    <div class="plate objective" id="objective">Secure all three supply sectors, then destroy the hostile headquarters.</div>
  </div>
  <div class="message" id="message"></div>
  <div class="bottom">
    <div class="plate panel"><div class="title" id="selectionTitle">No unit selected</div><div id="selectionInfo">Drag a box around units, then right-click to issue orders.</div><div class="actions" id="actions"></div><div class="hint">A attack-move · S stop · 1-4 recruit · WASD/Arrows camera · wheel zoom</div></div>
    <div class="plate miniwrap"><canvas id="mini" width="200" height="132"></canvas></div>
  </div>
</div>
<script>
(() => {
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const mini=document.getElementById('mini'),mctx=mini.getContext('2d');
const ui={supply:document.getElementById('supply'),command:document.getElementById('command'),sectors:document.getElementById('sectors'),title:document.getElementById('selectionTitle'),info:document.getElementById('selectionInfo'),actions:document.getElementById('actions'),message:document.getElementById('message'),objective:document.getElementById('objective')};
ctx.imageSmoothingEnabled=false;mctx.imageSmoothingEnabled=false;
const WORLD={w:2304,h:1536,tile:32};
const TEAM={BLUE:0,RED:1};
const colors={blue:'#2d6ba4',blue2:'#eed36e',red:'#983d35',red2:'#d2c1a3',shadow:'rgba(0,0,0,.35)'};
let dpr=1,last=performance.now(),time=0,gameOver=false,nextId=1,toastTimer=0;
let camera={x:70,y:770,z:1};
let mouse={x:0,y:0,wx:0,wy:0,down:false,startX:0,startY:0,drag:false,attackMove:false};
let keys=new Set(),selected=new Set(),units=[],buildings=[],points=[],projectiles=[],particles=[];
let player={supply:560,cap:30,used:0,sectors:0,incomeClock:0},enemy={supply:9999,spawnClock:8,orderClock:0};
const terrain=[];
function rand(a,b){return a+Math.random()*(b-a)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function resize(){dpr=Math.min(2,devicePixelRatio||1);canvas.width=innerWidth*dpr;canvas.height=innerHeight*dpr;canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();
for(let y=0;y<WORLD.h/WORLD.tile;y++)for(let x=0;x<WORLD.w/WORLD.tile;x++){let n=Math.sin(x*.43)+Math.cos(y*.37)+Math.sin((x+y)*.19);terrain.push(n>1.45?2:n<-1.45?1:0)}
const types={
 infantry:{name:'Infantry Squad',hp:110,speed:62,range:145,damage:12,rate:1.0,sight:235,cost:80,cap:2,size:12},
 drone:{name:'Strike Drone',hp:65,speed:105,range:220,damage:22,rate:1.8,sight:320,cost:130,cap:3,size:10,air:true},
 medic:{name:'Field Medic',hp:80,speed:67,range:105,damage:0,rate:.8,sight:220,cost:110,cap:2,size:11,medic:true},
 commander:{name:'Commander',hp:170,speed:58,range:155,damage:16,rate:.9,sight:270,cost:220,cap:4,size:14,commander:true},
 raider:{name:'Hostile Rifle Team',hp:100,speed:59,range:140,damage:11,rate:1.05,sight:220,cost:0,cap:0,size:12},
 armor:{name:'Hostile Armor',hp:260,speed:43,range:185,damage:28,rate:2.1,sight:245,cost:0,cap:0,size:18}
};
function addUnit(type,team,x,y){const t=types[type],u={id:nextId++,type,team,x,y,vx:0,vy:0,hp:t.hp,maxHp:t.hp,cool:rand(0,.5),target:null,order:null,selected:false,veteran:0,kills:0,angle:0,flash:0};units.push(u);if(team===TEAM.BLUE)player.used+=t.cap;return u}
function addBuilding(type,team,x,y){const b={id:nextId++,type,team,x,y,w:type==='hq'?96:72,h:type==='hq'?82:62,hp:type==='hq'?1350:700,maxHp:type==='hq'?1350:700,selected:false,queue:[],timer:0};buildings.push(b);return b}
function addPoint(x,y){points.push({x,y,r:34,owner:null,progress:0,contested:false})}
const blueHQ=addBuilding('hq',TEAM.BLUE,220,1180),redHQ=addBuilding('hq',TEAM.RED,2070,280);
addPoint(670,1110);addPoint(1160,770);addPoint(1660,430);
[['infantry',320,1160],['infantry',350,1210],['medic',290,1240],['drone',260,1115],['commander',390,1165]].forEach(a=>addUnit(a[0],TEAM.BLUE,a[1],a[2]));
[['raider',1940,330],['raider',1990,380],['raider',1895,280],['armor',2010,220]].forEach(a=>addUnit(a[0],TEAM.RED,a[1],a[2]));
function worldPos(sx,sy){return{x:(sx-camera.x)/camera.z,y:(sy-camera.y)/camera.z}}
function screenPos(x,y){return{x:x*camera.z+camera.x,y:y*camera.z+camera.y}}
function selectOnly(entity,add=false){if(!add){selected.clear();units.forEach(u=>u.selected=false);buildings.forEach(b=>b.selected=false)}if(entity){if(add&&selected.has(entity.id)){selected.delete(entity.id);entity.selected=false}else{selected.add(entity.id);entity.selected=true}}refreshUI()}
function selectedEntities(){return [...units,...buildings].filter(e=>selected.has(e.id))}
function selectedUnits(){return units.filter(u=>selected.has(u.id)&&u.team===TEAM.BLUE)}
function hitEntity(wx,wy){const all=[...units,...buildings].sort((a,b)=>(b.y||0)-(a.y||0));return all.find(e=>{const r=e.w?Math.max(e.w,e.h)/2:types[e.type].size+8;return Math.hypot(wx-e.x,wy-e.y)<r})}
canvas.addEventListener('mousedown',e=>{if(e.button!==0)return;mouse.down=true;mouse.startX=e.clientX;mouse.startY=e.clientY;mouse.drag=false});
canvas.addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;const w=worldPos(mouse.x,mouse.y);mouse.wx=w.x;mouse.wy=w.y;if(mouse.down&&Math.hypot(e.clientX-mouse.startX,e.clientY-mouse.startY)>6)mouse.drag=true});
canvas.addEventListener('mouseup',e=>{if(e.button!==0)return;mouse.down=false;if(mouse.drag){const a=worldPos(mouse.startX,mouse.startY),b=worldPos(e.clientX,e.clientY);if(!e.shiftKey)selectOnly(null);for(const u of units)if(u.team===TEAM.BLUE&&u.x>=Math.min(a.x,b.x)&&u.x<=Math.max(a.x,b.x)&&u.y>=Math.min(a.y,b.y)&&u.y<=Math.max(a.y,b.y)){selected.add(u.id);u.selected=true}refreshUI()}else{const w=worldPos(e.clientX,e.clientY),hit=hitEntity(w.x,w.y);selectOnly(hit&&hit.team===TEAM.BLUE?hit:null,e.shiftKey)}mouse.drag=false});
canvas.addEventListener('contextmenu',e=>{e.preventDefault();const w=worldPos(e.clientX,e.clientY),hit=hitEntity(w.x,w.y);issueOrder(w.x,w.y,hit)});
canvas.addEventListener('wheel',e=>{e.preventDefault();const before=worldPos(e.clientX,e.clientY);camera.z=clamp(camera.z*(e.deltaY<0?1.1:.9),.55,1.5);camera.x=e.clientX-before.x*camera.z;camera.y=e.clientY-before.y*camera.z},{passive:false});
addEventListener('keydown',e=>{keys.add(e.key.toLowerCase());if(e.key.toLowerCase()==='a'){mouse.attackMove=true;toast('Attack-move: choose a destination')}if(e.key.toLowerCase()==='s')selectedUnits().forEach(u=>u.order=null);if(['1','2','3','4'].includes(e.key))recruit(['infantry','drone','medic','commander'][+e.key-1])});
addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
function issueOrder(x,y,hit){const us=selectedUnits();if(!us.length)return;if(hit&&hit.team===TEAM.RED){us.forEach(u=>u.order={kind:'attack',target:hit});return}const cols=Math.ceil(Math.sqrt(us.length)),spacing=32;us.forEach((u,i)=>{const ox=(i%cols-(cols-1)/2)*spacing,oy=(Math.floor(i/cols)-(Math.ceil(us.length/cols)-1)/2)*spacing;u.order={kind:mouse.attackMove?'attackMove':'move',x:x+ox,y:y+oy}});mouse.attackMove=false}
function recruit(type){const hq=buildings.find(b=>b.selected&&b.team===TEAM.BLUE&&b.type==='hq');const t=types[type];if(!hq||gameOver)return;if(player.supply<t.cost){toast('Insufficient supply');return}if(player.used+t.cap>player.cap){toast('Command limit reached');return}player.supply-=t.cost;player.used+=t.cap;hq.queue.push({type,time:type==='commander'?8:type==='drone'?6:4.5,remaining:type==='commander'?8:type==='drone'?6:4.5,reserved:true});refreshUI()}
function refreshUI(){const es=selectedEntities();ui.supply.textContent=Math.floor(player.supply);ui.command.textContent=`${player.used}/${player.cap}`;ui.sectors.textContent=`${player.sectors}/3`;ui.actions.innerHTML='';if(!es.length){ui.title.textContent='No unit selected';ui.info.textContent='Drag a box around units, then right-click to issue orders.';return}if(es.length>1){const blue=es.filter(e=>e.team===TEAM.BLUE);ui.title.textContent=`Task Force (${blue.length})`;ui.info.textContent=blue.map(e=>types[e.type]?.name||'Headquarters').reduce((a,n)=>(a[n]=(a[n]||0)+1,a),{});ui.info.textContent=Object.entries(ui.info.textContent).map(([k,v])=>`${v}× ${k}`).join(' · ');return}const e=es[0];if(e.w){ui.title.textContent=e.team===TEAM.BLUE?'Defence Headquarters':'Hostile Headquarters';ui.info.textContent=`Integrity ${Math.ceil(e.hp)}/${e.maxHp}${e.queue?.length?` · Production queue ${e.queue.length}`:''}`;if(e.team===TEAM.BLUE)[['1 Infantry', 'infantry'],['2 Drone','drone'],['3 Medic','medic'],['4 Commander','commander']].forEach(([label,type])=>{const b=document.createElement('button');b.className='action';b.textContent=`${label} (${types[type].cost})`;b.onclick=()=>recruit(type);ui.actions.appendChild(b)});return}const t=types[e.type];ui.title.innerHTML=`${t.name}${e.veteran?'<span class="badge">VETERAN</span>':''}`;ui.info.textContent=`Health ${Math.ceil(e.hp)}/${e.maxHp} · Damage ${Math.round(t.damage*(1+e.veteran*.15))} · Range ${t.range}`}
function toast(s){ui.message.textContent=s;ui.message.classList.add('show');toastTimer=2.2}
function nearestEnemy(u,range=types[u.type].sight){let best=null,bd=range;for(const e of [...units,...buildings])if(e.team!==u.team&&e.hp>0){const d=dist(u,e);if(d<bd){bd=d;best=e}}return best}
function moveToward(u,x,y,dt){const t=types[u.type],dx=x-u.x,dy=y-u.y,d=Math.hypot(dx,dy);if(d<4){u.vx=u.vy=0;return true}let ax=dx/d,ay=dy/d;for(const o of units)if(o!==u&&o.team===u.team&&!types[o.type].air){const od=dist(u,o),min=types[u.type].size+types[o.type].size+5;if(od<min&&od>0){ax+=(u.x-o.x)/od*(min-od)/min*.8;ay+=(u.y-o.y)/od*(min-od)/min*.8}}const l=Math.hypot(ax,ay)||1;u.vx=ax/l*t.speed;u.vy=ay/l*t.speed;u.x=clamp(u.x+u.vx*dt,20,WORLD.w-20);u.y=clamp(u.y+u.vy*dt,20,WORLD.h-20);u.angle=Math.atan2(u.vy,u.vx);return false}
function shoot(u,target){const t=types[u.type];if(t.medic)return;u.cool=t.rate*(u.team===TEAM.BLUE?.95:1.05);projectiles.push({x:u.x,y:u.y-8,tx:target.x,ty:target.y,target,team:u.team,speed:t.air?390:310,damage:t.damage*(1+u.veteran*.15),life:2,drone:t.air});u.flash=.12}
function updateUnit(u,dt){const t=types[u.type];u.cool-=dt;u.flash=Math.max(0,u.flash-dt);if(t.medic){let ally=units.filter(a=>a.team===u.team&&a!==u&&a.hp<a.maxHp&&dist(u,a)<t.range).sort((a,b)=>a.hp/a.maxHp-b.hp/b.maxHp)[0];if(ally&&u.cool<=0){ally.hp=Math.min(ally.maxHp,ally.hp+15);u.cool=t.rate;particles.push({x:ally.x,y:ally.y-18,life:.7,text:'+',kind:'heal'})}}
 let target=u.target&&u.target.hp>0?u.target:null;if(u.order?.kind==='attack'&&u.order.target?.hp>0)target=u.order.target;if(!target&&(u.order?.kind==='attackMove'||u.team===TEAM.RED))target=nearestEnemy(u);u.target=target;
 if(target){const d=dist(u,target);if(d<=t.range){u.vx=u.vy=0;u.angle=Math.atan2(target.y-u.y,target.x-u.x);if(u.cool<=0)shoot(u,target)}else if(u.order?.kind==='attack'||u.order?.kind==='attackMove'||u.team===TEAM.RED)moveToward(u,target.x,target.y,dt)}else if(u.order&&(u.order.kind==='move'||u.order.kind==='attackMove')){if(moveToward(u,u.order.x,u.order.y,dt))u.order=null}
 if(t.commander)for(const a of units)if(a.team===u.team&&dist(u,a)<135&&a!==u)a.hp=Math.min(a.maxHp,a.hp+1.1*dt);
}
function updateProjectiles(dt){for(const p of projectiles){p.life-=dt;const target=p.target&&p.target.hp>0?p.target:{x:p.tx,y:p.ty};const dx=target.x-p.x,dy=target.y-p.y,d=Math.hypot(dx,dy);if(d<p.speed*dt+7){if(p.target&&p.target.hp>0){p.target.hp-=p.damage;for(let i=0;i<5;i++)particles.push({x:p.target.x+rand(-8,8),y:p.target.y+rand(-8,8),vx:rand(-25,25),vy:rand(-35,5),life:rand(.25,.55),kind:'dust'});if(p.target.hp<=0){const killer=units.find(u=>u.team===p.team&&dist(u,p)<260);if(killer){killer.kills++;if(killer.kills===3){killer.veteran=1;toast(`${types[killer.type].name} promoted to veteran`)}}}}p.life=0}else{p.x+=dx/d*p.speed*dt;p.y+=dy/d*p.speed*dt}}
 projectiles=projectiles.filter(p=>p.life>0)}
function updateCapture(dt){for(const p of points){const b=units.filter(u=>u.team===TEAM.BLUE&&dist(u,p)<p.r+18).length,r=units.filter(u=>u.team===TEAM.RED&&dist(u,p)<p.r+18).length;p.contested=b&&r;if(p.contested)continue;const side=b?TEAM.BLUE:r?TEAM.RED:null;if(side===null){p.progress+=(p.owner===null?0:(p.owner===TEAM.BLUE?-1:1))*dt*.03;continue}const dir=side===TEAM.BLUE?1:-1;p.progress=clamp(p.progress+dir*dt*.17,-1,1);const old=p.owner;if(p.progress>=1)p.owner=TEAM.BLUE;if(p.progress<=-1)p.owner=TEAM.RED;if(old!==p.owner&&p.owner!==null)toast(p.owner===TEAM.BLUE?'Supply sector secured':'Supply sector lost')}player.sectors=points.filter(p=>p.owner===TEAM.BLUE).length}
function spawnEnemy(){const wave=player.sectors>=2?['raider','raider','armor']:['raider','raider'];wave.forEach((type,i)=>{const u=addUnit(type,TEAM.RED,redHQ.x-90-i*26,redHQ.y+90+i*18);u.order={kind:'attackMove',x:blueHQ.x,y:blueHQ.y}});toast('Hostile reinforcement wave detected')}
function update(dt){if(gameOver)return;time+=dt;toastTimer-=dt;if(toastTimer<=0)ui.message.classList.remove('show');const pan=410*dt/camera.z;if(keys.has('a')&&document.activeElement.tagName!=='BUTTON'){}if(keys.has('w')||keys.has('arrowup'))camera.y+=pan*camera.z;if(keys.has('s')||keys.has('arrowdown'))camera.y-=pan*camera.z;if(keys.has('a')||keys.has('arrowleft'))camera.x+=pan*camera.z;if(keys.has('d')||keys.has('arrowright'))camera.x-=pan*camera.z;
 camera.x=clamp(camera.x,innerWidth-WORLD.w*camera.z-100,100);camera.y=clamp(camera.y,innerHeight-WORLD.h*camera.z-100,100);
 for(const u of units)updateUnit(u,dt);updateProjectiles(dt);updateCapture(dt);
 for(const b of buildings){if(b.queue?.length){const q=b.queue[0];q.remaining-=dt;if(q.remaining<=0){addUnit(q.type,b.team,b.x+rand(-70,70),b.y+95);player.used-=types[q.type].cap;q.reserved=false;b.queue.shift();toast(`${types[q.type].name} ready`)}}}
 player.incomeClock+=dt;if(player.incomeClock>=2){player.incomeClock-=2;player.supply+=18+player.sectors*14}
 enemy.spawnClock-=dt;if(enemy.spawnClock<=0){enemy.spawnClock=14+rand(0,6);spawnEnemy()}
 units=units.filter(u=>{if(u.hp>0)return true;if(u.team===TEAM.BLUE)player.used-=types[u.type].cap;selected.delete(u.id);return false});buildings=buildings.filter(b=>b.hp>0);
 if(!buildings.includes(redHQ)){gameOver=true;ui.objective.textContent='Victory — hostile headquarters neutralized.';toast('VICTORY');ui.message.style.fontSize='42px'}else if(!buildings.includes(blueHQ)){gameOver=true;ui.objective.textContent='Defeat — defence headquarters lost.';toast('DEFEAT');ui.message.style.fontSize='42px'}
 refreshUI();
}
function tileColor(t,x,y){if(t===2)return (x+y)%3?'#485536':'#52613b';if(t===1)return (x+y)%2?'#56604f':'#606957';return (x*7+y*3)%5?'#68704b':'#717a50'}
function drawTerrain(){const start=worldPos(0,0),end=worldPos(innerWidth,innerHeight);const x0=clamp(Math.floor(start.x/32)-1,0,WORLD.w/32),y0=clamp(Math.floor(start.y/32)-1,0,WORLD.h/32),x1=clamp(Math.ceil(end.x/32)+1,0,WORLD.w/32),y1=clamp(Math.ceil(end.y/32)+1,0,WORLD.h/32);for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++){const t=terrain[y*(WORLD.w/32)+x],s=screenPos(x*32,y*32);ctx.fillStyle=tileColor(t,x,y);ctx.fillRect(s.x,s.y,33*camera.z,33*camera.z);if(t===2&&((x*13+y*17)%5===0)){ctx.fillStyle='#263526';ctx.fillRect(s.x+10*camera.z,s.y+5*camera.z,6*camera.z,18*camera.z);ctx.fillStyle='#405238';ctx.fillRect(s.x+4*camera.z,s.y+1*camera.z,18*camera.z,12*camera.z)}if(t===1&&((x+y)%7===0)){ctx.fillStyle='#85856c';ctx.fillRect(s.x+8*camera.z,s.y+16*camera.z,10*camera.z,5*camera.z)}}
 // roads
 ctx.lineCap='square';ctx.strokeStyle='#8c805f';ctx.lineWidth=44*camera.z;ctx.beginPath();[[160,1260],[640,1110],[1160,770],[1670,430],[2130,245]].forEach((p,i)=>{const s=screenPos(...p);i?ctx.lineTo(s.x,s.y):ctx.moveTo(s.x,s.y)});ctx.stroke();ctx.strokeStyle='#6e654e';ctx.lineWidth=3*camera.z;ctx.setLineDash([14*camera.z,18*camera.z]);ctx.stroke();ctx.setLineDash([])}
function drawPoint(p){const s=screenPos(p.x,p.y),r=p.r*camera.z;ctx.save();ctx.translate(s.x,s.y);ctx.fillStyle=p.owner===TEAM.BLUE?'rgba(45,107,164,.28)':p.owner===TEAM.RED?'rgba(152,61,53,.28)':'rgba(240,220,150,.18)';ctx.strokeStyle=p.contested?'#fff':p.owner===TEAM.BLUE?'#71aee4':p.owner===TEAM.RED?'#d8786f':'#d8c985';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.strokeStyle='#f0db83';ctx.beginPath();ctx.arc(0,0,r+6,-Math.PI/2,-Math.PI/2+Math.PI*2*Math.abs(p.progress));ctx.stroke();ctx.fillStyle='#1d2423';ctx.fillRect(-7*camera.z,-25*camera.z,14*camera.z,28*camera.z);ctx.fillStyle='#c7b46c';ctx.fillRect(-4*camera.z,-22*camera.z,8*camera.z,18*camera.z);ctx.restore()}
function drawBuilding(b){const s=screenPos(b.x,b.y),w=b.w*camera.z,h=b.h*camera.z;ctx.save();ctx.translate(s.x,s.y);ctx.fillStyle='rgba(0,0,0,.32)';ctx.fillRect(-w*.52,-h*.35,w*1.08,h*.85);ctx.fillStyle=b.team===TEAM.BLUE?'#365d78':'#704039';ctx.fillRect(-w/2,-h/2,w,h);ctx.fillStyle='#a7976c';for(let i=-1;i<=1;i++)ctx.fillRect((i*23-8)*camera.z,-h*.56,16*camera.z,18*camera.z);ctx.fillStyle='#2b2d2a';ctx.fillRect(-15*camera.z,0,30*camera.z,h/2);ctx.fillStyle=b.team===TEAM.BLUE?colors.blue2:colors.red2;ctx.fillRect(-w*.38,-h*.34,w*.24,h*.18);if(b.selected){ctx.strokeStyle='#f5e48e';ctx.lineWidth=2;ctx.strokeRect(-w/2-5,-h/2-5,w+10,h+10)}drawHealth(b,-w/2,-h/2-10,w);ctx.restore()}
function drawHealth(e,x,y,w){ctx.fillStyle='#251b18';ctx.fillRect(x,y,w,5);ctx.fillStyle=e.team===TEAM.BLUE?'#66a4d8':'#c55b50';ctx.fillRect(x,y,w*clamp(e.hp/e.maxHp,0,1),5)}
function drawUnit(u){const t=types[u.type],s=screenPos(u.x,u.y),z=camera.z;ctx.save();ctx.translate(Math.round(s.x),Math.round(s.y));if(t.air){ctx.globalAlpha=.25;ctx.fillStyle='#000';ctx.beginPath();ctx.ellipse(7*z,11*z,15*z,7*z,0,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;ctx.rotate(u.angle);ctx.fillStyle=u.team===TEAM.BLUE?colors.blue:'#6f4841';ctx.fillRect(-13*z,-4*z,26*z,8*z);ctx.fillStyle='#202724';ctx.fillRect(-4*z,-11*z,8*z,22*z);ctx.fillStyle=u.team===TEAM.BLUE?colors.blue2:colors.red2;ctx.fillRect(-2*z,-2*z,4*z,4*z);ctx.restore();return}
 ctx.fillStyle=colors.shadow;ctx.beginPath();ctx.ellipse(3*z,6*z,(t.size+4)*z,(t.size*.55)*z,0,0,Math.PI*2);ctx.fill();ctx.rotate(u.angle+Math.PI/2);const body=u.team===TEAM.BLUE?colors.blue:colors.red;ctx.fillStyle=body;if(u.type==='armor'){ctx.fillRect(-15*z,-16*z,30*z,32*z);ctx.fillStyle='#2c312d';ctx.fillRect(-10*z,-20*z,20*z,22*z);ctx.fillRect(-3*z,-31*z,6*z,20*z)}else{ctx.fillRect(-7*z,-6*z,14*z,17*z);ctx.fillStyle=u.team===TEAM.BLUE?colors.blue2:colors.red2;ctx.beginPath();ctx.arc(0,-8*z,6*z,0,Math.PI*2);ctx.fill();ctx.fillStyle='#262b27';if(t.medic){ctx.fillStyle='#d9ddd3';ctx.fillRect(-6*z,-1*z,12*z,10*z);ctx.fillStyle='#a33';ctx.fillRect(-2*z,0,4*z,8*z);ctx.fillRect(-5*z,3*z,10*z,3*z)}else if(t.commander){ctx.fillStyle='#d8b84d';ctx.fillRect(-9*z,-2*z,18*z,4*z);ctx.fillStyle='#242924';ctx.fillRect(-2*z,-22*z,4*z,17*z)}else{ctx.fillRect(-2*z,-20*z,4*z,18*z)}}if(u.flash){ctx.fillStyle='#ffe9a6';ctx.beginPath();ctx.arc(0,-25*z,5*z,0,Math.PI*2);ctx.fill()}ctx.restore();if(u.selected){ctx.strokeStyle='#ffe37b';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(s.x,s.y+5*z,(t.size+7)*z,(t.size*.65+4)*z,0,0,Math.PI*2);ctx.stroke()}if(u.hp<u.maxHp)drawHealth(u,s.x-16*z,s.y-24*z,32*z)}
function drawProjectile(p){const s=screenPos(p.x,p.y);ctx.fillStyle=p.drone?'#ffd36a':'#fff0b5';ctx.beginPath();ctx.arc(s.x,s.y,p.drone?4:2,0,Math.PI*2);ctx.fill()}
function drawParticles(dt){for(const p of particles){p.life-=dt;const s=screenPos(p.x,p.y);if(p.kind==='heal'){ctx.fillStyle='#9de7b0';ctx.font=`bold ${18*camera.z}px sans-serif`;ctx.fillText(p.text,s.x,s.y-p.life*20)}else{p.x+=(p.vx||0)*dt;p.y+=(p.vy||0)*dt;ctx.globalAlpha=clamp(p.life*2,0,1);ctx.fillStyle='#b59b73';ctx.fillRect(s.x,s.y,3*camera.z,3*camera.z);ctx.globalAlpha=1}}particles=particles.filter(p=>p.life>0)}
function drawFog(){ctx.save();ctx.fillStyle='rgba(9,12,12,.67)';ctx.fillRect(0,0,innerWidth,innerHeight);ctx.globalCompositeOperation='destination-out';for(const u of units)if(u.team===TEAM.BLUE){const s=screenPos(u.x,u.y),r=types[u.type].sight*camera.z,g=ctx.createRadialGradient(s.x,s.y,r*.35,s.x,s.y,r);g.addColorStop(0,'rgba(0,0,0,1)');g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(s.x,s.y,r,0,Math.PI*2);ctx.fill()}for(const b of buildings)if(b.team===TEAM.BLUE){const s=screenPos(b.x,b.y),r=260*camera.z;ctx.fillStyle='rgba(0,0,0,.85)';ctx.beginPath();ctx.arc(s.x,s.y,r,0,Math.PI*2);ctx.fill()}ctx.restore()}
function drawSelectionBox(){if(!mouse.down||!mouse.drag)return;ctx.fillStyle='rgba(255,230,120,.12)';ctx.strokeStyle='#ffe278';const x=Math.min(mouse.startX,mouse.x),y=Math.min(mouse.startY,mouse.y),w=Math.abs(mouse.x-mouse.startX),h=Math.abs(mouse.y-mouse.startY);ctx.fillRect(x,y,w,h);ctx.strokeRect(x+.5,y+.5,w,h)}
function drawMini(){mctx.clearRect(0,0,mini.width,mini.height);mctx.fillStyle='#576044';mctx.fillRect(0,0,mini.width,mini.height);mctx.strokeStyle='#8d8060';mctx.lineWidth=4;mctx.beginPath();[[14,112],[55,95],[101,66],[145,36],[190,18]].forEach((p,i)=>i?mctx.lineTo(...p):mctx.moveTo(...p));mctx.stroke();for(const p of points){mctx.fillStyle=p.owner===TEAM.BLUE?'#4f9bd3':p.owner===TEAM.RED?'#c65a50':'#e1d18c';mctx.fillRect(p.x/WORLD.w*200-2,p.y/WORLD.h*132-2,5,5)}for(const b of buildings){mctx.fillStyle=b.team===TEAM.BLUE?'#64a7df':'#d25d53';mctx.fillRect(b.x/WORLD.w*200-4,b.y/WORLD.h*132-4,8,8)}for(const u of units){mctx.fillStyle=u.team===TEAM.BLUE?'#7fc3f1':'#e27369';mctx.fillRect(u.x/WORLD.w*200,u.y/WORLD.h*132,2,2)}const a=worldPos(0,0),b=worldPos(innerWidth,innerHeight);mctx.strokeStyle='#fff4b0';mctx.strokeRect(a.x/WORLD.w*200,a.y/WORLD.h*132,(b.x-a.x)/WORLD.w*200,(b.y-a.y)/WORLD.h*132)}
mini.addEventListener('mousedown',e=>{const r=mini.getBoundingClientRect();const x=(e.clientX-r.left)/r.width*WORLD.w,y=(e.clientY-r.top)/r.height*WORLD.h;camera.x=innerWidth/2-x*camera.z;camera.y=innerHeight/2-y*camera.z});
function render(dt){ctx.clearRect(0,0,innerWidth,innerHeight);drawTerrain();points.forEach(drawPoint);[...buildings].sort((a,b)=>a.y-b.y).forEach(drawBuilding);[...units].sort((a,b)=>a.y-b.y).forEach(drawUnit);projectiles.forEach(drawProjectile);drawParticles(dt);drawFog();drawSelectionBox();drawMini()}
function frame(now){const dt=Math.min(.033,(now-last)/1000);last=now;update(dt);render(dt);requestAnimationFrame(frame)}
refreshUI();toast('Secure the supply sectors');requestAnimationFrame(frame);
