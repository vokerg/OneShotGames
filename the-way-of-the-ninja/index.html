<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090c12">
  <meta name="description" content="An original momentum-based ninja platformer built with Canvas and no external assets.">
  <title>Way of the Ninja: Momentum Trial</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div>
          <strong>Way of the Ninja</strong>
          <span>Momentum Trial</span>
        </div>
      </div>
      <div class="hud" aria-label="Game status">
        <span><small>Sector</small><b id="hud-level">1/5</b></span>
        <span><small>Time</small><b id="hud-time">0.0</b></span>
        <span><small>Gold</small><b id="hud-gold">0/0</b></span>
        <span><small>Score</small><b id="hud-score">00000</b></span>
        <span><small>Deaths</small><b id="hud-deaths">0</b></span>
      </div>
      <button id="sound-toggle" class="sound" type="button" aria-pressed="true">Sound: on</button>
    </header>

    <section class="stage" aria-label="Way of the Ninja game">
      <canvas id="game" width="1280" height="704" tabindex="0">
        Your browser needs Canvas support to run this game.
      </canvas>
      <div class="touch-controls" aria-label="Touch controls">
        <div class="touch-group">
          <button type="button" data-action="left" aria-label="Move left">◀</button>
          <button type="button" data-action="right" aria-label="Move right">▶</button>
        </div>
        <div class="touch-group">
          <button type="button" data-action="restart" aria-label="Restart level">↻</button>
          <button class="jump" type="button" data-action="jump" aria-label="Jump">JUMP</button>
        </div>
      </div>
    </section>

    <footer class="help">
      <span><kbd>A</kbd><kbd>D</kbd> / arrows move</span>
      <span><kbd>Space</kbd> / <kbd>Z</kbd> jump</span>
      <span><kbd>R</kbd> restart</span>
      <span><kbd>P</kbd> pause</span>
      <span class="objective"><i></i> switch → exit</span>
    </footer>
  </main>
  <script type="module" src="src/game.js"></script>
</body>
</html>
